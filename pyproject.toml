[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-agentic-redteam"
version = "1.0.0"
description = "Production-grade agentic red-team campaign orchestrator (own-lab only, stdlib-first)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["redteam", "campaign", "orchestrator", "security", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
f1-redteam = "firmware.cli:main"

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["firmware*"]